<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Tarea - Lista de tareas</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 560px; margin: 30px auto; padding: 0 12px; }
    form { display: flex; gap: 8px; margin-bottom: 8px; }
    form input { flex: 1; padding: 6px; }
    ul { list-style: none; padding: 0; }
    li { display: flex; align-items: center; gap: 8px; border: 1px solid #ccc; padding: 8px; margin-bottom: 6px; }
    li span { flex: 1; }
    .hecha span { text-decoration: line-through; color: #888; }
    .alta { border-left: 6px solid #c0392b; }
    .media { border-left: 6px solid #f39c12; }
    .baja { border-left: 6px solid #27ae60; }
    .error { color: #c0392b; }
  </style>
</head>
<body>
  <h1>Mi lista de tareas</h1>

  <form id="formulario">
    <input id="texto" type="text" placeholder="Escribe una tarea">
    <select id="prioridad">
      <option value="alta">Alta</option>
      <option value="media" selected>Media</option>
      <option value="baja">Baja</option>
    </select>
    <button type="submit">Agregar</button>
  </form>
  <p id="aviso" class="error"></p>

  <ul id="lista"></ul>
  <p id="resumen"></p>

  <script src="app.js"></script>
</body>
</html>
